name: Lint

on:
  push:
    branches: [main, master, codex/**]
  pull_request:
    branches: [main, master, codex/**]

# 取消同一分支的旧 run，避免在快速 push 时堆积
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-check:
    name: compileall (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -q -r requirements-dev.txt

      - name: Compile all sources
        shell: pwsh
        # 编译但保持并行；同时让 ImportError 提前暴露
        run: python -m compileall -q -j 0 app/

      - name: Compile main entry
        shell: pwsh
        run: python -m py_compile main.py build.py

  ruff:
    name: ruff (静态检查)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 规则集定义在 ruff.toml。只启用当前代码已满足的规则（见该文件头注释），
      # 定位是「防回退」而不是一次性补齐历史欠账。
      - name: Install ruff
        run: python -m pip install -q "ruff>=0.6"

      - name: Ruff check
        run: ruff check --config ruff.toml --output-format=github app/ tests/ main.py tools/

  architecture:
    name: 架构约束（分层 + 裸 except）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 纯标准库实现（tools/check_architecture.py），不依赖第三方包，离线可跑。
      # 守护两条当前已满足的约束：底层不依赖表现层、不新增裸 except。
      - name: Check architecture
        run: python tools/check_architecture.py -v

  forbidden-patterns:
    name: forbidden patterns scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for bare except / silent pass
        shell: pwsh
        # 提示给开发者，CI 不强制失败
        run: |
          $matches = Select-String -Path "app/**/*.py" -Pattern "^\s*except\s*:\s*$" -ErrorAction SilentlyContinue
          if ($matches) {
            Write-Host "::warning::Found bare except: blocks. Consider specifying exception type."
            $matches | ForEach-Object { Write-Host "  $($_.Path):$($_.LineNumber)" }
          } else {
            Write-Host "No bare except: blocks found."
          }
