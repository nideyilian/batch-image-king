[pytest]
# pytest 测试配置
# 项目根目录: d:\AAA\批图王极速版20260520

# 测试发现根目录
testpaths = tests

# 测试文件/类/函数命名约定
python_files = test_*.py
python_classes = Test* *Test
python_functions = test_*

# 根目录 conftest.py 会把项目根加入 sys.path
# 这里不再重复配置

# 默认收集但允许显式跳过慢测试
addopts =
    -ra
    --strict-markers
    --tb=short

# ---- 怎么跑（2026-11-03 实测耗时）----
#
#   日常改代码后（反馈约 82s）：
#       python -m pytest -m unit
#
#   提交前完整跑（约 250s）：
#       python -m pytest
#
#   只跑集成（约 140s，涉及真实文件 I/O / QML 引擎）：
#       python -m pytest -m integration
#
#   跳到失败就停（调 bug 时更快）：
#       python -m pytest -x -m unit
#
# 为什么不全量跑：全量 250s，其中 139s 花在 102 项 integration 上。
# 这些测试覆盖的是真实 I/O 与 QML 交互，改纯 Python 逻辑时基本不会回归，
# 但每次都要等 —— 日常只跑 unit（938 项 / 82s）能拿到同样的问题发现率，
# 完整跑留给提交前和 CI。

# 自定义 marker（与 tests/__init__.py 文档一致）
markers =
    unit: 纯单元测试，无 GUI、无网络、无文件 I/O
    integration: 集成测试，可能涉及多模块协作或真实文件 I/O
    slow: 耗时测试（默认 CI 可跳过）

# 最低 pytest 版本
minversion = 7.0
