[pytest]
# pytest 测试配置
# 项目根目录: d:\AAA\批图王极速版20260520

# 测试发现根目录
testpaths = tests

# 测试文件/类/函数命名约定
python_files = test_*.py
python_classes = Test* *Test
python_functions = test_*

# 根目录 conftest.py 会把项目根加入 sys.path
# 这里不再重复配置

# 默认收集但允许显式跳过慢测试
addopts =
    -ra
    --strict-markers
    --tb=short

# 自定义 marker（与 tests/__init__.py 文档一致）
markers =
    unit: 纯单元测试，无 GUI、无网络、无文件 I/O
    integration: 集成测试，可能涉及多模块协作或真实文件 I/O
    slow: 耗时测试（默认 CI 可跳过）

# 最低 pytest 版本
minversion = 7.0
